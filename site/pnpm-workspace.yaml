# site/ is its own pnpm workspace root — do NOT delete this file.
#
# The repo root gained a pnpm-workspace.yaml (for the dependency build allowlist),
# which makes the root a workspace root. vercel.json builds this site with
# `cd site && pnpm install`, and pnpm walks UP from here looking for a workspace
# root. Without this file it finds the repo root's, and site/ inherits the ROOT
# project's dependency graph.
#
# That breaks the build, verified locally 2026-08-01:
#   - root workspace, site NOT listed  -> install exits 0 and installs NOTHING
#   - root workspace, site listed      -> install works, but astro resolves the
#     ROOT's `zod@4` instead of the `zod@^3.25.76` starlight requires, and the
#     build dies with "Cannot read properties of undefined (reading '_zod')"
#   - THIS file present                -> site gets its own store (zod@3.25.76),
#     `astro build` exits 0, 99 pages built
#
# An empty `packages` list is deliberate: site/ has no sub-packages. The file
# exists purely to stop the upward walk.
packages: []
