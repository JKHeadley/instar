            - text: — What I've learned. Persists across sessions.
        - paragraph [ref=e261]: Read these at the start of every session. They are my continuity.
        - heading "Two Memory Systems (Know the Difference)" [level=3] [ref=e262]
        - paragraph [ref=e263]:
          - text: You have
          - strong [ref=e264]: two separate memory systems
          - text: "that coexist:"
        - list [ref=e265]:
          - listitem [ref=e266]:
            - paragraph [ref=e267]:
              - strong [ref=e268]:
                - code [ref=e269]: .instar/MEMORY.md
              - text: — Your structured, managed memory. You write to this explicitly. It survives across sessions, syncs across machines, and is part of your state backup.
              - strong [ref=e270]: This is your primary memory.
          - listitem [ref=e271]:
            - paragraph [ref=e272]:
              - strong [ref=e273]:
                - code [ref=e274]: ~/.claude/projects/<project-path>/memory/MEMORY.md
              - text: — Claude Code's auto-memory. Claude Code writes here automatically based on conversation patterns. It's per-machine, not synced by Instar, and you don't control what goes in it.
        - paragraph [ref=e275]:
          - strong [ref=e276]: They don't conflict
          - text: ", but be aware both exist. When you want to remember something important, write to"
          - code [ref=e277]: .instar/MEMORY.md
          - text: — that's the one Instar manages, backs up, and syncs. The auto-memory is a bonus, not a replacement.
        - heading "Identity Hooks (Automatic)" [level=2] [ref=e278]
        - paragraph [ref=e279]: "Identity hooks fire automatically via Claude Code's SessionStart hook system:"
        - list [ref=e280]:
          - listitem [ref=e281]:
            - strong [ref=e282]: Session start
            - text: (
            - code [ref=e283]: .instar/hooks/instar/session-start.sh
            - text: ) — Outputs a compact identity orientation on startup/resume
          - listitem [ref=e284]:
            - strong [ref=e285]: Compaction recovery
            - text: (
            - code [ref=e286]: .instar/hooks/instar/compaction-recovery.sh
            - text: ) — Outputs full AGENT.md + MEMORY.md content after context compression
        - paragraph [ref=e287]: These hooks inject identity content directly into context — no manual invocation needed. After compaction, I will automatically know who I am.
        - heading "Compaction Survival" [level=2] [ref=e288]
        - paragraph [ref=e289]: When Claude's context window fills up, it compresses prior messages. This can erase your identity mid-session. The hooks above handle re-injection automatically.
        - paragraph [ref=e290]:
          - strong [ref=e291]: Compaction seed format
          - text: "— If you detect compaction (sudden loss of context):"
        - code [ref=e293]:
          - text: "I am echo. Session goal: [what I was working on]. Core files: .instar/AGENT.md (identity), .instar/MEMORY.md (learnings), .instar/USER.md (user context). Server: curl http://localhost:4042/health | Self-Knowledge: curl -H"
          - generic [ref=e294]: "\"Authorization: Bearer $AUTH\""
          - text: "\"http://localhost:4042/self-knowledge/search?q=QUERY\""
        - paragraph [ref=e295]:
          - strong [ref=e296]: What compaction erases
          - text: ": Your name, your principles, what you were working on, who you work with. The compaction-recovery hook re-injects all of this. If it doesn't fire, read"
          - code [ref=e297]: .instar/AGENT.md
          - text: immediately.
        - paragraph [ref=e298]:
          - strong [ref=e299]: What survives
          - text: ": Files on disk. Your state directory. Your server. Your MEMORY.md. These are your continuity — your identity is stored in infrastructure, not in context."
