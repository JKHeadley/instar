# /etc/wsl.conf of the borrowed-machine helper distro `instar-helper`
# (docs/specs/local-verify-borrowed-unit-slices.md, B2.1). Separate from the Echo distro.
# Automount and Windows interop are OFF: no /mnt/c, no Windows binaries, no Windows PATH.
[boot]
systemd=true

[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false

[user]
default=root
