# Pull-request description lint at open time — the EARLY WARNING.
#
# Runs safe-merge's own merge-time body checks (ELI16, decision audit, release
# fragment) plus the UX Impact rule on EVERY pull request, whatever its base.
# The ELI16, decision-audit and release-fragment gates run only for base `main`,
# so a stacked pull request used to meet its first description refusal at merge
# time, after a full verifier run.
#
# Signal, never authority: warnings and a job summary only, the job always
# succeeds, and it is NOT a required context. The merge-time floor stays the gate.
#
# SECURITY: on: pull_request (never pull_request_target); read-only token; no
# persisted checkout credentials; the checker code is checked out from the
# default branch and the pull request's commits are read only as data.
# Trust boundary, stated plainly: GitHub loads this YAML from the pull request's
# merge commit, so a pull request CAN change its own warning. That is accepted:
# the warning gates nothing (not required; safe-merge re-checks at merge time).
# pull_request_target would load the YAML from the BASE branch, which for a
# stacked pull request is a branch that may predate this file, so the stacked
# pull requests this exists for would get no warning at all.
name: PR description lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-description-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  description-lint:
    name: Description early warning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout the checker from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request's base and head
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_PUSHER: ${{ github.actor }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Same literal author scope as the UX impact gate.
          INSTAR_UX_SCOPE: "jkheadley"
        run: node scripts/pr-description-lint.mjs
