name: Linux verifier comparison
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA of the source to verify
        type: string
        required: true
      red_control:
        description: Check only that the runner catches a known assertion failure
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  comparison:
    if: ${{ !inputs.red_control }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [unit, integration, e2e]
        shard: [1, 2, 3, 4]
    steps:
      - name: Check source pin
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y tmux
      - name: Prepare clean checkout
        run: |
          mkdir -p "$RUNNER_TEMP/verification"
          git rev-parse HEAD > "$RUNNER_TEMP/verification/source.txt"
          node --version > "$RUNNER_TEMP/verification/node.txt"
          /usr/bin/time -p -o "$RUNNER_TEMP/verification/install.txt" npm ci
          /usr/bin/time -p -o "$RUNNER_TEMP/verification/build.txt" npm run build
      - name: Run the same lane twice
        env:
          LANE: ${{ matrix.lane }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -u
          case "$LANE" in
            unit) CONFIG=vitest.config.ts ;;
            integration) CONFIG=vitest.integration.config.ts ;;
            e2e) CONFIG=vitest.e2e.config.ts ;;
          esac
          failed=0
          for sample in cold warm; do
            report="$RUNNER_TEMP/verification/$sample"
            tmux_temp=$(mktemp -d)
            set +e
            TMUX_TMPDIR="$tmux_temp" /usr/bin/time -p -o "$report.time" \
              node_modules/.bin/vitest run --config "$CONFIG" --shard="$SHARD/4" \
                --maxWorkers=1 --minWorkers=1 --allowOnly=false --reporter=json \
                --outputFile.json="$report.json"
            rc=$?
            set -e
            printf '%d\n' "$rc" > "$report.exit"
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.lane }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/verification
          retention-days: 2
  red-control:
    if: ${{ inputs.red_control }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check source pin
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Require the exact known failure
        run: |
          cat > tests/unit/linux-verifier-red-control.test.ts <<'TEST'
          import { it, expect } from 'vitest';
          it('reports the Linux trial red control', () => expect('red').toBe('green'));
          TEST
          rc=0
          node_modules/.bin/vitest run --config vitest.config.ts \
            tests/unit/linux-verifier-red-control.test.ts --maxWorkers=1 --minWorkers=1 \
            --reporter=json --outputFile.json="$RUNNER_TEMP/red-control.json" || rc=$?
          test "$rc" -eq 1
          jq -e '.numFailedTests == 1 and any(.testResults[].assertionResults[]; .title == "reports the Linux trial red control" and .status == "failed")' "$RUNNER_TEMP/red-control.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: red-control
          path: ${{ runner.temp }}/red-control.json
          retention-days: 2
