name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  invariants:
    name: Repo Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No npm install needed — the script is pure node stdlib.
      - run: node scripts/check-repo-invariants.mjs

  docs-coverage:
    name: Docs Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Pure node stdlib — no install needed.
      # --check enforces per-category floors calibrated to current state;
      # PRs that improve docs may also raise the floors.
      - run: node scripts/docs-coverage.mjs --check
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-coverage
          path: |
            .instar/docs-coverage.md
            .instar/docs-coverage.json

  cartographer-freshness:
    name: Cartographer Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Pure node stdlib + git — no install needed (cartographer-doc-freshness
      # spec #2 Tier-3 ratchet). Floors ship loose (ratio>=0); cartographer state
      # is gitignored so a fresh checkout is a vacuous structural pass — the
      # ratchet's teeth engage on machines that have authored the doc-tree.
      - run: node scripts/cartographer-freshness.mjs --check
      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartographer-freshness
          path: |
            .instar/cartographer-freshness.json

  standards-coverage:
    name: Standards Enforcement Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      # The shared YAML parser gives the Root self-wiring check semantic workflow
      # validation rather than a quote/comment-bypassable text approximation.
      # No build is needed (cartographer-conformance-audit spec #3 Tier-3 ratchet).
      # For each constitutional standard in
      # docs/STANDARDS-REGISTRY.md, verify the structural guard its prose names
      # exists on disk. Aggregate and per-family ratio floors ratchet as gaps close;
      # content-bound per-family audit records fail when a changed area has not been
      # re-audited. A hard ZERO ceiling remains on dangling refs (a standard must
      # never cite a guard that doesn't exist — a broken guarantee).
      - name: Resolve protected-base area ledger
        id: area-audit-base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          if git cat-file -e "$BASE_SHA:docs/standards-registry-area-audits.json"; then
            git show "$BASE_SHA:docs/standards-registry-area-audits.json" > "$RUNNER_TEMP/standards-area-audits-base.json"
            echo "required=1" >> "$GITHUB_OUTPUT"
          else
            echo "required=0" >> "$GITHUB_OUTPUT"
          fi
      - run: node scripts/standards-coverage.mjs --check
        env:
          STANDARDS_AREA_AUDIT_BASE_FILE: ${{ runner.temp }}/standards-area-audits-base.json
          STANDARDS_AREA_AUDIT_BASE_REQUIRED: ${{ steps.area-audit-base.outputs.required }}
      # Window-10 ratchets (2026-08-09). SAME shape as the area-audit step above, deliberately:
      # review pass 6 rejected a hand-rolled `git show origin/main:<path>` inside the lint, because a
      # branch name is not the accepted change boundary and on a main checkout can denote the commit
      # under test. The proven pattern is a PINNED base SHA from the event, the base copy extracted to
      # RUNNER_TEMP, and the checker handed a file path plus an explicit required flag.
      # `if: always()` — so these steps run even when an earlier step in this job fails.
      #
      # CORRECTED BY REVIEW PASS 11, and the correction matters more than the change. Pass 10 reported
      # that these three ratchets "have NEVER RUN in CI … not once", and I wrote that into this file as
      # established fact WITHOUT CHECKING IT. It is false: the `lint` job runs `npm run lint`, whose
      # chain ends with all three of these lints, and it executes on every run of this branch. Their
      # clean output has been at the bottom of every local gate run this week — the evidence was in
      # front of me and I adopted a precise-sounding finding over it.
      #
      # What is TRUE, and is the reason this step exists: the PINNED-BASE-BOUND invocation had never
      # run. The unbound run in the `lint` job cannot do the shrink-only comparison against the
      # protected base, because that needs the `*_BASE_FILE` / `*_BASE_REQUIRED` binding assembled by
      # the step above. So the ratchets executed; their HISTORICAL arm did not. That is a narrower and
      # duller claim than the one I published, and it is the accurate one.
      #
      # The idiom is copied, not invented: `if: always()` is already used by the artifact upload steps
      # in this same file. A step that FAILS still fails the job regardless of the condition that
      # started it, so making these unconditional strengthens the gate rather than weakening it — it
      # removes only their dependence on an unrelated step's verdict.
      - name: Resolve protected-base window-10 baselines
        id: w10-baselines
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          bind() {
            local path="$1" out="$2" key="$3"
            if git cat-file -e "$BASE_SHA:$path"; then
              git show "$BASE_SHA:$path" > "$RUNNER_TEMP/$out"
              echo "$key=1" >> "$GITHUB_OUTPUT"
            else
              echo "$key=0" >> "$GITHUB_OUTPUT"
            fi
          }
          bind docs/enforcement-fingerprint-baseline.json fingerprint-base.json fingerprint
          bind docs/deferral-referent-baseline.json deferral-base.json deferral
          bind docs/enforcement-gaps-floor.json gapfloor-base.json gapfloor
      - name: Window-10 ratchets against the protected base
        if: always()
        env:
          ENFORCEMENT_FINGERPRINT_BASE_FILE: ${{ runner.temp }}/fingerprint-base.json
          ENFORCEMENT_FINGERPRINT_BASE_REQUIRED: ${{ steps.w10-baselines.outputs.fingerprint }}
          DEFERRAL_REFERENT_BASE_FILE: ${{ runner.temp }}/deferral-base.json
          DEFERRAL_REFERENT_BASE_REQUIRED: ${{ steps.w10-baselines.outputs.deferral }}
          ENFORCEMENT_GAP_FLOOR_BASE_FILE: ${{ runner.temp }}/gapfloor-base.json
          ENFORCEMENT_GAP_FLOOR_BASE_REQUIRED: ${{ steps.w10-baselines.outputs.gapfloor }}
        run: |
          node scripts/lint-enforcement-fingerprint.mjs
          node scripts/lint-deferral-referent-resolves.mjs
          node scripts/lint-enforcement-gap-records.mjs
      - name: Migration consumer lockstep
        run: node scripts/lint-migration-consumer-completeness.js --diff-base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standards-coverage
          path: |
            .instar/standards-coverage.json
          include-hidden-files: true
          if-no-files-found: error

  lint:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Unit Tests (node ${{ matrix.node-version }}, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel other shards if one fails — we want the full picture.
      fail-fast: false
      matrix:
        node-version: [20, 22]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          # lint-template-sha-history walks `git log -- src/templates/scripts/
          # telegram-reply.sh` to assert every historical SHIPPED content is
          # in the migrator's prior-shipped set. A shallow clone (default
          # depth=1) defeats that — and silently rubber-stamps the assertion.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      # vitest shard syntax: --shard=<index>/<total>. Each runner executes a
      # deterministic disjoint slice of the test files; union is the full suite.
      # fileParallelism stays off within each shard to preserve isolation.
      - run: npm run test:push -- --shard=${{ matrix.shard }}/4
        env:
          AUDIT_CHANGE_KIND: ${{ github.event_name == 'pull_request' && 'pull_request' || (github.event_name == 'push' && 'push' || '') }}
          AUDIT_CHANGE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || '') }}
          AUDIT_CHANGE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'push' && github.sha || '') }}
      - name: Working-tree integrity check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Test suite mutated the working tree. SafeGitExecutor / SafeFsExecutor likely bypassed."
            git status --porcelain
            git diff
            exit 1
          fi

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run test:integration
      - name: Working-tree integrity check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Integration tests mutated the working tree. SafeGitExecutor / SafeFsExecutor likely bypassed."
            git status --porcelain
            git diff
            exit 1
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run test:e2e
      - name: Working-tree integrity check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::E2E tests mutated the working tree. SafeGitExecutor / SafeFsExecutor likely bypassed."
            git status --porcelain
            git diff
            exit 1
          fi

  contract:
    name: Contract Tests (Live API)
    runs-on: ubuntu-latest
    needs: unit
    # Only run when adapter source files or contract tests change
    if: >
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files_names || '', 'src/messaging/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run contract tests
        env:
          SLACK_CONTRACT_BOT_TOKEN: ${{ secrets.SLACK_CONTRACT_BOT_TOKEN }}
        run: |
          if [ -z "$SLACK_CONTRACT_BOT_TOKEN" ]; then
            echo "⚠️  SLACK_CONTRACT_BOT_TOKEN not configured — skipping contract tests"
            echo "To enable: add SLACK_CONTRACT_BOT_TOKEN to repository secrets"
            exit 0
          fi
          npx vitest run --config vitest.contract.config.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
