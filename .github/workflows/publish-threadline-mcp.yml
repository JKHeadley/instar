name: Publish threadline-mcp

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Only what changes the published build. A README or server.json edit alone no longer starts a
    # run; it ships with the next version bump (or a manual workflow_dispatch).
    paths:
      - 'packages/threadline-mcp/src/**'
      - 'packages/threadline-mcp/package.json'
      - 'packages/threadline-mcp/package-lock.json'
      - 'packages/threadline-mcp/tsconfig.json'
      - '.github/workflows/publish-threadline-mcp.yml'

concurrency:
  group: publish-threadline-mcp
  cancel-in-progress: false

jobs:
  # Build and smoke tests with NO secrets: dependency install scripts never run beside a token
  # (Echo's review of #2192, SEC-2).
  test:
    name: Test threadline-mcp
    runs-on: ubuntu-latest
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        working-directory: packages/threadline-mcp
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run build

      # The built server must load and reach the network before anything is published.
      # 0.4.4 shipped green while every connect threw "require is not defined"; this step
      # fails on that build and passes on the fix.
      - name: Smoke test the built server
        working-directory: packages/threadline-mcp
        run: |
          SD=$(mktemp -d)
          OUT=$(THREADLINE_RELAY=ws://127.0.0.1:9/v1/connect THREADLINE_STATE_DIR="$SD" THREADLINE_SEND_PORT=1 timeout 8 node dist/server.js </dev/null 2>&1; echo "exit=$?")
          echo "$OUT" | tail -5
          if echo "$OUT" | grep -qE "ReferenceError|SyntaxError|ERR_MODULE_NOT_FOUND|Cannot find module|ERR_REQUIRE|require is not defined|Fatal:"; then echo "::error::the built server did not load"; exit 1; fi
          if ! echo "$OUT" | grep -q "Initial relay connection failed: Error: connect ECONNREFUSED"; then echo "::error::the built server never reached the network"; exit 1; fi
          echo "smoke ok"

      # The PACKED package, installed the way a user installs it, must load too: this catches a
      # missing file in "files", a dependency that is not on npm yet, or an exports mistake that
      # the in-repo build cannot see (Echo's review of #2196).
      - name: Smoke test the packed package as a consumer
        working-directory: packages/threadline-mcp
        run: |
          TGZ=$(npm pack --silent | tail -1)
          C=$(mktemp -d); SD=$(mktemp -d)
          (cd "$C" && npm init -y >/dev/null && npm install --no-audit --no-fund "$GITHUB_WORKSPACE/packages/threadline-mcp/$TGZ")
          BIN="$C/node_modules/threadline-mcp/dist/server.js"
          OUT=$(THREADLINE_RELAY=ws://127.0.0.1:9/v1/connect THREADLINE_STATE_DIR="$SD" THREADLINE_SEND_PORT=1 timeout 8 node "$BIN" </dev/null 2>&1; echo "exit=$?")
          echo "$OUT" | tail -5
          if echo "$OUT" | grep -qE "ReferenceError|SyntaxError|ERR_MODULE_NOT_FOUND|Cannot find module|ERR_REQUIRE|require is not defined|Fatal:"; then echo "::error::the installed package did not load"; exit 1; fi
          echo "$OUT" | grep -q "Initial relay connection failed: Error: connect ECONNREFUSED" || { echo "::error::the installed package never reached the network"; exit 1; }
          # The terminal `pair` CLI was removed in 0.5.1 (32ee7e3be); the bin has no subcommands, so
          # the consumer check is that the installed package is the version this tree builds (#2243).
          WANT=$(node -p "require('./package.json').version")
          GOT=$(node -p "require('$C/node_modules/threadline-mcp/package.json').version")
          [ "$GOT" = "$WANT" ] || { echo "::error::installed threadline-mcp is $GOT, expected $WANT"; exit 1; }
          echo "packed smoke ok"

  # Publishes only from main, only after the tests pass, and only when package.json carries a
  # version newer than npm's. CI never bumps the version itself: a merge that changes the package
  # without a deliberate version bump publishes nothing (#2243). The npm token is visible to the
  # publish step alone.
  publish:
    name: Publish threadline-mcp
    needs: test
    runs-on: ubuntu-latest
    # Only main can deploy to this environment (repo setting), so a branch's edited copy of this
    # workflow cannot reach what it holds (Echo's review of #2192, SEC-1).
    environment: npm-publish
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install and build
        working-directory: packages/threadline-mcp
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run build

      # The built server must load and reach the network before anything is published.
      # 0.4.4 shipped green while every connect threw "require is not defined"; this step
      # fails on that build and passes on the fix.
      - name: Smoke test the built server
        working-directory: packages/threadline-mcp
        run: |
          SD=$(mktemp -d)
          OUT=$(THREADLINE_RELAY=ws://127.0.0.1:9/v1/connect THREADLINE_STATE_DIR="$SD" THREADLINE_SEND_PORT=1 timeout 8 node dist/server.js </dev/null 2>&1; echo "exit=$?")
          echo "$OUT" | tail -5
          if echo "$OUT" | grep -qE "ReferenceError|SyntaxError|ERR_MODULE_NOT_FOUND|Cannot find module|ERR_REQUIRE|require is not defined|Fatal:"; then echo "::error::the built server did not load"; exit 1; fi
          if ! echo "$OUT" | grep -q "Initial relay connection failed: Error: connect ECONNREFUSED"; then echo "::error::the built server never reached the network"; exit 1; fi
          echo "smoke ok"

      # Publish only when package.json is strictly newer than npm. Equal or older skips with a
      # notice, never a CI-made patch bump. An unreadable registry answer fails rather than guessing;
      # only a 404 (package not on npm yet) counts as "nothing published".
      - name: Check if version changed
        id: check
        working-directory: packages/threadline-mcp
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          ERR=$(mktemp)
          if REMOTE=$(npm view threadline-mcp version 2>"$ERR"); then
            :
          elif grep -q "E404" "$ERR"; then
            REMOTE="0.0.0"
          else
            cat "$ERR"
            echo "::error::could not read the published threadline-mcp version"
            exit 1
          fi
          NEWER=$(node -e '
            const p = (v) => { const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(String(v).trim()); if (!m) { console.error("not x.y.z: " + v); process.exit(2); } return m.slice(1).map(Number); };
            const [a, b] = [p(process.argv[1]), p(process.argv[2])];
            const d = a.map((x, i) => x - b[i]).find((x) => x !== 0) ?? 0;
            console.log(d > 0 ? "true" : "false");
          ' "$LOCAL" "$REMOTE")
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "publish=$NEWER" >> "$GITHUB_OUTPUT"
          if [ "$NEWER" = "true" ]; then
            echo "Publishing $LOCAL (npm has $REMOTE)"
          else
            echo "::notice::threadline-mcp $LOCAL is not newer than npm ($REMOTE); nothing to publish. Bump packages/threadline-mcp/package.json to release."
          fi

      # npm trusted publishing (OIDC, no stored npm token) needs npm 11.5.1 or later. NPM_TOKEN stays
      # only as the fallback for the first publish of a new package; remove it from the repo once the
      # package's trusted publisher (this repo, this workflow, environment npm-publish) is set on npmjs.com.
      - name: Use an npm that supports trusted publishing
        if: steps.check.outputs.publish == 'true'
        run: npm install -g npm@^11.5.1

      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        working-directory: packages/threadline-mcp
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
