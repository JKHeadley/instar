name: Publish threadline-mcp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/threadline-mcp/**'

concurrency:
  group: publish-threadline-mcp
  cancel-in-progress: false

jobs:
  publish:
    name: Publish threadline-mcp
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # RELEASE_TOKEN is a PAT that can bypass branch protection for version bump commits.
          # Falls back to GITHUB_TOKEN but that will fail if branch protection is enabled.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: packages/threadline-mcp
        run: npm ci

      - name: Build
        working-directory: packages/threadline-mcp
        run: npm run build

      # The built server must load and reach the network before anything is published.
      # 0.4.4 shipped green while every connect threw "require is not defined"; this step
      # fails on that build and passes on the fix.
      - name: Smoke test the built server
        working-directory: packages/threadline-mcp
        run: |
          SD=$(mktemp -d)
          OUT=$(THREADLINE_RELAY=ws://127.0.0.1:9/v1/connect THREADLINE_STATE_DIR="$SD" THREADLINE_SEND_PORT=1 timeout 8 node dist/server.js </dev/null 2>&1; echo "exit=$?")
          echo "$OUT" | tail -5
          if echo "$OUT" | grep -qE "ReferenceError|SyntaxError|ERR_MODULE_NOT_FOUND|Cannot find module|ERR_REQUIRE|require is not defined|Fatal:"; then echo "::error::the built server did not load"; exit 1; fi
          if ! echo "$OUT" | grep -q "Initial relay connection failed: Error: connect ECONNREFUSED"; then echo "::error::the built server never reached the network"; exit 1; fi
          echo "smoke ok"

      - name: Check if version changed
        id: check
        working-directory: packages/threadline-mcp
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view threadline-mcp version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL" = "$REMOTE" ]; then
            npm version patch --no-git-tag-version
            NEW=$(node -p "require('./package.json').version")
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            echo "Bumped $LOCAL → $NEW"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
            echo "Already at $LOCAL (remote: $REMOTE)"
          fi

      - name: Publish to npm
        working-directory: packages/threadline-mcp
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        if: steps.check.outputs.bumped == 'true'
        env:
          HUSKY: '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/threadline-mcp/package.json packages/threadline-mcp/package-lock.json
          git commit -m "chore: release threadline-mcp v${{ steps.check.outputs.version }} [skip ci]"
          git push origin main
