name: ux-impact-pr-gate

on:
  pull_request:
    types: [opened, synchronize, edited]
    paths:
      - 'src/server/routes.ts'
      - 'src/commands/server.ts'
      - 'src/messaging/**'
      - 'src/dashboard/**'
      - 'src/templates/**'
      - '.github/workflows/ux-impact-pr-gate.yml'
      - 'scripts/ux-impact-lint.mjs'

concurrency:
  group: ux-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ux-impact:
    name: UX impact declaration
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout base ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch PR head
        run: git fetch --no-tags origin ${{ github.event.pull_request.head.sha }}
      - name: Load the PR's checker
        run: git checkout "${{ github.event.pull_request.head.sha }}" -- scripts/ux-impact-lint.mjs
      - name: Evaluate UX declaration
        id: lint
        env:
          # Literal, protected kill switch. Do not source this from vars/secrets.
          INSTAR_UX_LINT: "on"
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set +e
          node scripts/ux-impact-lint.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --body "$PR_BODY"
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::UX lint internal error; fail-open for merge but mark auto-merge ineligible"
            echo "internal_error=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"
