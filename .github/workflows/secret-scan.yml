name: Secret Scan

# A real secret scan on every pull request (and on each push to main).
#
# gitleaks reads only the commits the pull request adds (base..head), with the
# default gitleaks rules plus the exceptions in `.gitleaks.toml`. That file may
# list EXACT VALUES only, never a path, folder, file, rule or commit: a
# folder-wide exception let a planted fake token through on 2026-11-21.
# `scripts/lint-gitleaks-allowlist-exact.mjs` enforces that rule, refuses a
# `.gitleaksignore` file, and runs first, so a widened exception fails this check
# before gitleaks is even downloaded.
#
# The other ways a finding could be excused are closed too:
#   - an inline `gitleaks:allow` comment is ignored (--ignore-gitleaks-allow);
#   - `.gitleaksignore` is never read (--gitleaks-ignore-path points at an empty dir);
#   - files whose PATH gitleaks' own default allowlist skips (node_modules, vendor,
#     lockfiles, image/font/document extensions, …) have their CONTENT scanned
#     through `gitleaks stdin`, where no path rule applies.
#
# The gitleaks release and its checksum are pinned: a changed binary fails the
# checksum step, never silently scans with different rules.
#
# Not closed here, and known: a same-repo pull request runs this workflow and
# the checker from its own head, so it could weaken them; Local Verify flags any
# change under .github/workflows as a protected path that needs an independent
# second-pass review before it can merge, and the main ruleset requires that
# Local Verify status. Pushes with missing or divergent ancestry scan the full
# history reachable from the new head and all shadowed paths in its tree.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: gitleaks walks base..head, and a pull request
          # can carry many commits.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The checker reads TOML with the repo's own `smol-toml` dependency.
      - run: npm ci --ignore-scripts

      - name: Exceptions list exact values only, and no .gitleaksignore
        run: node scripts/lint-gitleaks-allowlist-exact.mjs

      - name: Install gitleaks (pinned release and checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks-ignore-none"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Work out the commit range this change adds
        id: range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SCAN_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          RANGE=$(node scripts/lint-gitleaks-allowlist-exact.mjs --ci-range "$BASE_SHA" "$HEAD_SHA" "$SCAN_EVENT")
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "gitleaks over $RANGE"

      - name: Scan the commits this change adds
        id: scan
        env:
          SCAN_RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          status=0
          gitleaks git --no-banner --redact --exit-code 42 \
            --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-ignore-none" \
            --config .gitleaks.toml \
            --log-opts="$SCAN_RANGE" \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json" . || status=$?
          if [ "$status" -eq 42 ]; then
            echo "finding=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            echo "::error::The Git history secret scanner could not complete." >&2
          fi
          exit "$status"

      - name: Scan the content of files whose path gitleaks' default exceptions would skip
        id: shadow
        env:
          SCAN_RANGE: ${{ steps.range.outputs.range }}
          SCAN_HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          LIST="$RUNNER_TEMP/shadowed-paths.nul"
          node scripts/lint-gitleaks-allowlist-exact.mjs --shadowed-paths "$SCAN_RANGE" > "$LIST"
          expected=$(tr -cd '\0' < "$LIST" | wc -c | tr -d ' ')
          found=0; n=0
          while IFS= read -r -d '' p; do
            n=$((n+1))
            if git show "$SCAN_HEAD:$p" | gitleaks stdin --no-banner --redact --exit-code 42 \
                 --ignore-gitleaks-allow \
                 --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-ignore-none" \
                 --config .gitleaks.toml; then
              continue
            else
              statuses=("${PIPESTATUS[@]}")
            fi
            if [ "${statuses[0]}" -ne 0 ] || [ "${statuses[1]}" -ne 42 ]; then
              echo "::error::The scanner could not inspect a shadowed file." >&2
              exit 2
            fi
            echo "finding=true" >> "$GITHUB_OUTPUT"
            found=1
          done < "$LIST"
          if [ "$n" -ne "$expected" ]; then
            echo "scanned $n of $expected listed file(s); refusing to pass on a short loop" >&2
            exit 2
          fi
          echo "$n file(s) scanned by content because their path is on gitleaks' default skip list"
          exit "$found"

      - name: Say what to do when something is found
        if: failure() && (steps.scan.outputs.finding == 'true' || steps.shadow.outputs.finding == 'true')
        run: |
          echo 'The secret scan found something that looks like a live secret in this change.' >&2
          echo 'If it is a real secret: rotate it now, remove it from the commits, then push again.' >&2
          echo 'If it is a fixture or placeholder: add its EXACT value to .gitleaks.toml with' >&2
          echo '  node scripts/lint-gitleaks-allowlist-exact.mjs --entry <file holding the exact value>' >&2
          echo 'Folder, file, rule and commit exceptions, gitleaks:allow comments and .gitleaksignore are refused.' >&2
          exit 1
