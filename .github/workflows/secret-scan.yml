name: Secret Scan

# A real secret scan on every pull request (and on each push to main).
#
# gitleaks reads only the commits the pull request adds (base..head), with the
# default gitleaks rules plus the exceptions in `.gitleaks.toml`. That file may
# list EXACT VALUES only, never a path, folder, file, rule or commit: a
# folder-wide exception let a planted fake token through on 2026-11-21.
# `scripts/lint-gitleaks-allowlist-exact.mjs` enforces that rule and runs first,
# so a widened exception fails this check before gitleaks is even downloaded.
#
# The gitleaks release and its checksum are pinned: a changed binary fails the
# checksum step, never silently scans with different rules.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: gitleaks walks base..head, and a pull request
          # can carry many commits.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Exceptions list exact values only
        run: node scripts/lint-gitleaks-allowlist-exact.mjs

      - name: Install gitleaks (pinned release and checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan the commits this change adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit for this event; scanning the head commit only."
            RANGE="$HEAD_SHA^..$HEAD_SHA"
          else
            RANGE="$BASE_SHA..$HEAD_SHA"
          fi
          echo "gitleaks over $RANGE"
          gitleaks git --no-banner --redact --exit-code 1 \
            --config .gitleaks.toml \
            --log-opts="$RANGE" \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json" .

      - name: Say what to do when something is found
        if: failure()
        run: |
          echo 'The secret scan found something that looks like a live secret in this change.' >&2
          echo 'If it is a real secret: rotate it now, remove it from the commits, then push again.' >&2
          echo 'If it is a fixture or placeholder: add its EXACT value to .gitleaks.toml with' >&2
          echo '  node scripts/lint-gitleaks-allowlist-exact.mjs --entry <file holding the exact value>' >&2
          echo 'Folder, file, rule and commit exceptions are refused.' >&2
          exit 1
